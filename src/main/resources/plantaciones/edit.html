<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">

<!--/*/ <th:block th:insert="~{top :: top}"></th:block> /*/-->

<body>

<div class="container">

    <!--/*/ <th:block th:insert="~{header :: header}"></th:block> /*/-->

    <!-- ============================================================= -->
    <!-- Inicio Zona de Ajuste -->

    <h2>Plantaciones</h2>
    <div>
        <form class="form-horizontal" th:object="${entity}" th:action="@{/plantaciones}" method="post">
            <input type="hidden" th:field="*{id}"/>

            <div class="form-group">
                <label class="col-sm-2 control-label">Periodo</label>
                <div class="col-sm-10">
                    <input type="text" class="form-control" th:field="*{periodo}"/>
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-2 control-label">Fecha</label>
                <div class="col-sm-10">
                    <input type="date" class="form-control" th:field="*{fecha}"/>
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-2 control-label">Porcentaje Lote</label>
                <div class="col-sm-10">
                    <input type="text" class="form-control" th:field="*{porcentaje_lote}"/>
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-2 control-label">Fecha Cierre</label>
                <div class="col-sm-10">
                    <input type="date" class="form-control" th:field="*{fecha_cierre}"/>
                </div>
            </div>

            <div class="form-group">
                <div class="col-sm-2 control-label">
                    <label align="right">Cultivo</label>
                </div>

                <div class="col-sm-10">
                    <select class="form-control" th:field="*{cultivo}">
                        <option th:each="cultivo : ${cultivos}"
                                th:value="${cultivo.id}"
                                th:text="${cultivo.descrip}">
                        </option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <div class="col-sm-2 control-label">
                    <label align="right">Lote</label>
                </div>

                <div class="col-sm-10">
                    <select class="form-control" th:field="*{lote}">
                        <option th:each="lote : ${lotes}"
                                th:value="${lote.id}"
                                th:text="${lote.descrip + ' - Sup: ' + lote.sup}">
                        </option>
                    </select>
                </div>
            </div>

            <div class="row">
                <button type="submit" class="btn btn-success">Guardar</button>
                <a class="btn btn-default" th:href="${'/practico1/plantaciones'}">Cancelar</a>
            </div>
            <h5 style="color:red;" th:text="${message}"></h5>
        </form>
    </div>

    <!-- Fin Zona de Ajuste -->

</div>

</body>
</html>
