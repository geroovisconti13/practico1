<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">

<!--/*/ <th:block th:insert="~{top :: top}"></th:block> /*/-->

<body>

<div class="container">

    <!--/*/ <th:block th:insert="~{header :: header}"></th:block> /*/-->

    <!-- ============================================================= -->
    <!-- Inicio Zona de Ajuste -->

    <h2>Ventas</h2>
    <div>
        <form class="form-horizontal" th:object="${entity}" th:action="@{/ventas}" method="post">
            <input type="hidden" th:field="*{id}"/>

            <div class="form-group">
                <label class="col-sm-2 control-label">Fecha</label>
                <div class="col-sm-10">
                    <input type="date" class="form-control" th:field="*{fecha}"/>
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-2 control-label">Cantidad Vendida</label>
                <div class="col-sm-10">
                    <input type="text" class="form-control" th:field="*{cantvendida}"/>
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-2 control-label">Precio</label>
                <div class="col-sm-10">
                    <input type="text" class="form-control" th:field="*{precio}"/>
                </div>
            </div>

            <div class="form-group">
                <div class="col-sm-2 control-label">
                    <label align="right">Plantacion</label>
                </div>

                <div class="col-sm-10">
                    <select class="form-control" th:field="*{plantacion}">
                        <option th:each="plantacion : ${plantaciones}"
                                th:value="${plantacion.id}"
                                th:text="${plantacion.periodo + ' - ' + plantacion.fecha + ' - ' + plantacion.porcentaje_lote + '% - ' + plantacion.fecha_cierre}">
                        >
                        </option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <div class="col-sm-2 control-label">
                    <label align="right">Comprador</label>
                </div>

                <div class="col-sm-10">
                    <select class="form-control" th:field="*{compradores}">
                        <option th:each="compradores : ${compradores}"
                                th:value="${compradores.id}"
                                th:text="${compradores.nombre + ' - ' + compradores.direccion + ' - ' + compradores.cuit + ' - ' + compradores.iva + ' - ' + compradores.observacion}">
                            >
                        </option>
                    </select>
                </div>
            </div>


            <div class="row">
                <button type="submit" class="btn btn-success">Guardar</button>
                <a class="btn btn-default" th:href="${'/practico1/ventas'}">Cancelar</a>
            </div>
            <h5 style="color:red;" th:text="${message}"></h5>
        </form>
    </div>

    <!-- Fin Zona de Ajuste -->

</div>

</body>
</html>
